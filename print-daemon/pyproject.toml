[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "print-daemon"
version = "0.1.0"
description = "Stdlib-only PC daemon that prints queued ESC/POS jobs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
print-daemon = "print_daemon.cli:main"

[tool.setuptools.packages.find]
include = ["print_daemon*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
