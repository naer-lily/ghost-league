[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "print-service"
version = "0.1.0"
description = "Self-hosted thermal-printer job queue with leases and dedupe"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["print_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
