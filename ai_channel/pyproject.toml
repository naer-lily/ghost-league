[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-ai-channel"
version = "0.1.0"
description = "Account-backed Channel client for Ghost League"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ai-channel = "ai_channel.cli:main"

[tool.setuptools.packages.find]
include = ["ai_channel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Waka projection mode imports the sibling ``waka_channel`` package and Ghost's
# pure projection helpers, so the repository root must be importable when the
# suite is run from this directory.
pythonpath = ["..", "."]
