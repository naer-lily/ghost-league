[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-ai-channel"
version = "0.1.0"
description = "Stdlib-only account-backed AI simulator for Ghost League"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
ai-channel = "ai_channel.cli:main"

[tool.setuptools.packages.find]
include = ["ai_channel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
